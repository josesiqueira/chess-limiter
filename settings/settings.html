<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Limiter Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1><span class="icon">&#9881;</span> Chess Limiter Settings</h1>
    </header>

    <div class="form-section">
      <div class="form-group">
        <label for="username">Chess.com username:</label>
        <input type="text" id="username" placeholder="Enter your chess.com username">
      </div>

      <div class="form-group">
        <label for="daily-limit">Daily game limit:</label>
        <input type="number" id="daily-limit" min="1" value="5">
      </div>

      <div class="form-group">
        <button id="save-btn" class="save-btn">Save</button>
      </div>

      <div id="message" class="message" style="display: none;"></div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
